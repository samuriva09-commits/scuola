<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina principale - Lavori Scolastici</title>
    
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #090d16;
            --bg-surface: #111827;
            --bg-surface-hover: #1f2937;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(99, 102, 241, 0.4);
            
            --primary: #6366f1;
            --primary-light: #818cf8;
            --secondary: #a855f7;
            
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --text-subtle: #6b7280;

            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;

            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.06) 0%, transparent 45%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        /* HEADER SECTION */
        header {
            margin-bottom: 40px;
            text-align: center;
        }

        h4.main-title {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        h5.sub-title {
            font-size: 1.15rem;
            color: var(--text-muted);
            font-weight: 400;
            max-width: 600px;
            margin: 0 auto 36px auto;
        }

        /* STATS BAR */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 48px;
        }

        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-light);
        }

        .stat-card .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* CONTROLS (SEARCH & FILTERS) */
        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }

        @media (min-width: 768px) {
            .controls-section {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            max-width: 400px;
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-subtle);
        }

        .search-box input {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 12px 16px 12px 44px;
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .filter-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* PROJECTS GRID */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .project-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
            text-decoration: none;
            color: inherit;
        }

        .project-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .project-icon {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--primary-light);
        }

        .status-tag {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .status-completed {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .card-body h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .card-body p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            margin-top: auto;
        }

        .tags-list {
            display: flex;
            gap: 6px;
        }

        .tech-tag {
            font-size: 0.75rem;
            color: var(--text-subtle);
            background: rgba(255, 255, 255, 0.03);
            padding: 2px 8px;
            border-radius: var(--radius-sm);
        }

        .action-link {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-light);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .project-card:hover .action-link {
            color: #ffffff;
            transform: translateX(4px);
        }

        .no-projects {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            background: var(--bg-surface);
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-lg);
        }

        /* FOOTER */
        footer {
            margin-top: 80px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 32px;
            color: var(--text-subtle);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- HEADER -->
        <header>
            <h4 class="main-title">Pagina principale</h4>
            <h5 class="sub-title">sotto verranno inserite tutti i vari lavori</h5>
        </header>

        <!-- DASHBOARD STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="total-projects">0</div>
                <div class="label">Progetti Totali</div>
            </div>
            <div class="stat-card">
                <div class="number">HTML / CSS</div>
                <div class="label">Linguaggi Principali</div>
            </div>
        </div>

        <!-- SEARCH AND FILTERS -->
        <div class="controls-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Cerca un lavoro...">
            </div>
            <div class="filter-tags">
                <button class="filter-btn active" data-filter="all">Tutti</button>
                <button class="filter-btn" data-filter="html">HTML/CSS</button>
                <button class="filter-btn" data-filter="js">JavaScript</button>
            </div>
        </div>

        <!-- PROJECTS GRID -->
        <div class="projects-grid" id="projectsGrid">
            <!-- Nessun progetto attualmente inserito -->
            <div class="no-projects" id="emptyMessage">
                Nessun lavoro inserito al momento.
            </div>
        </div>

        <!-- FOOTER -->
        <footer>
            <p>&copy; 2026 Samuele</p>
        </footer>

    </div>

    <!-- SCRIPT RICERCA E FILTRI -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.project-card');
            const searchInput = document.getElementById('searchInput');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const totalProjectsCounter = document.getElementById('total-projects');
            const emptyMessage = document.getElementById('emptyMessage');

            // Aggiorna il contatore dei progetti
            totalProjectsCounter.textContent = cards.length;

            if (cards.length > 0 && emptyMessage) {
                emptyMessage.style.display = 'none';
            }

            // Ricerca
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                cards.forEach(card => {
                    const title = card.querySelector('h3').textContent.toLowerCase();
                    const desc = card.querySelector('p').textContent.toLowerCase();
                    if(title.includes(term) || desc.includes(term)) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });

            // Filtri
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const filter = btn.getAttribute('data-filter');
                    cards.forEach(card => {
                        if (filter === 'all' || card.getAttribute('data-category') === filter) {
                            card.style.display = 'flex';
                        } else {
                            card.style.display = 'none';
                        }
                    });
                });
            });
        });
    </script>
</body>
</html>
