<!DOCTYPE html>
<html>
    <head>
<style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
            font-size: 36px;
        }

        /* Griglia principale */
        .calculator {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: repeat(4, 65px);
            gap: 15px;
        }

        /* I campi di testo occupano tutte e 4 le colonne */
        input[type="text"] {
            grid-column: span 4;
            width: 100%;
            padding: 15px;
            font-size: 26px;
            border: 2px solid #e1e4e8;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: right;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #4a90e2;
        }

        #risultato {
            background-color: #f8f9fa;
            font-weight: bold;
            color: #333;
        }

        /* Pulsanti quadrati e perfettamente allineati */
        button {
            width: 65px;
            height: 65px;
            padding: 0;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #357abd;
        }

        button:active {
            transform: scale(0.96);
        }
    </style>
    <script>
        function somma() {
            var numero1 = parseFloat(document.getElementById("num1").value);
            var numero2 = parseFloat(document.getElementById("num2").value);
            var esito = numero1+numero2;
            document.getElementById("risultato").value =esito;
        }
        function sottrazione() {
            var numero1 = parseFloat(document.getElementById("num1").value);
            var numero2 = parseFloat(document.getElementById("num2").value);
            var esito = numero1 - numero2;
            document.getElementById("risultato").value =esito;
        }
         function divisione() {
            var numero1 = parseFloat(document.getElementById("num1").value);
            var numero2 = parseFloat(document.getElementById("num2").value);
            if (numero2 == 0) {
                document.getElementById("risultato").value = "Impossibile";
            } else {
                var esito = numero1 / numero2;
                document.getElementById("risultato").value = esito;
            }
        }
        function moltiplicazione() {
            var numero1 = parseFloat(document.getElementById("num1").value);
            var numero2 = parseFloat(document.getElementById("num2").value);
            var esito = numero1 * numero2;
            document.getElementById("risultato").value =esito;
        }
    </script>
    </head>
    <body>
        <h1>Calcolatrice </h1>
        <div class="calculator">
                <input type="text" id="num1" >
                <input type="text" id="num2" >
                <button onclick="somma()">+</button>
                <button onclick="sottrazione()">-</button>
                <button onclick="divisione()">/</button>
                <button onclick="moltiplicazione()">x</button>
                <input type="text" id="risultato" >
        </div>
    </body>
